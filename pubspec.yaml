name: voxwheel
description: "Pure Dart raycast vehicle dynamics solver with spring-damper wheel suspension, anti-roll bars, brush tire slip curves, Ackermann steering geometry, and multi-gear drivetrain simulation."
version: 0.1.0
repository: https://github.com/soulwax/voxwheel

environment:
  sdk: '>=3.0.0 <4.0.0'

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
